<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АвтоХаб Азия</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Как логотип asia.autohub: графит, серебро и красная искра. Машины на «подиуме» в цвет кузова.
     Название модели — узкий заглавный Oswald, как шильдик; цифры — моно, как в техпаспорте. */
  :root{
    --bg:#eceef0; --surface:#ffffff; --ink:#121315; --muted:#5f6369; --line:rgba(18,19,21,.09); --soft:rgba(18,19,21,.05);
    --accent:#c4161c; --accent-2:#9f1015; --on-accent:#ffffff;
    --ok:#1b7a49; --amber:#b86f0c;
    --stage-a:#f9f9fa; --stage-b:#dcdee1; --glass:#1c1e22; --tyre:#16171a; --rim:#a1a4a9; --shadow-car:rgba(18,19,21,.22);
    --shadow:0 1px 2px rgba(18,19,21,.04),0 12px 30px -18px rgba(18,19,21,.22);
    --display:"Oswald","Arial Narrow",Impact,sans-serif;
    --body:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --r:22px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0c0d0f; --surface:#17181b; --ink:#eeeff1; --muted:#9a9ea5; --line:rgba(255,255,255,.08); --soft:rgba(255,255,255,.05);
    --accent:#e5383b; --accent-2:#c4161c; --on-accent:#ffffff; --ok:#4cc58a; --amber:#f0a53a;
    --stage-a:#25272b; --stage-b:#111214; --glass:#0b0c0e; --tyre:#08090a; --rim:#757980; --shadow-car:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7); color-scheme:dark }}
  :root[data-theme="dark"]{
    --bg:#0c0d0f; --surface:#17181b; --ink:#eeeff1; --muted:#9a9ea5; --line:rgba(255,255,255,.08); --soft:rgba(255,255,255,.05);
    --accent:#e5383b; --accent-2:#c4161c; --on-accent:#ffffff; --ok:#4cc58a; --amber:#f0a53a;
    --stage-a:#25272b; --stage-b:#111214; --glass:#0b0c0e; --tyre:#08090a; --rim:#757980; --shadow-car:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7); color-scheme:dark }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  .wrap{max-width:620px;margin:0 auto;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view[hidden]{display:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- шапка ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .mark{display:flex;align-items:baseline;gap:8px;line-height:1}
  .mark b{font:600 26px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
  .mark span{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .mark b i{font-style:normal;color:var(--accent)}
  .langs{display:flex;background:var(--soft);border-radius:999px;padding:3px}
  .langs button{border:0;background:none;padding:6px 10px;border-radius:999px;font:500 12px var(--mono);letter-spacing:.06em;cursor:pointer;color:var(--muted)}
  .langs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .lead-in{font-size:15px;color:var(--muted);margin:-8px 0 16px;max-width:42ch}

  .ask{display:flex;gap:8px;background:var(--surface);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .ask input{flex:1;min-width:0;border:0;outline:0;background:none;padding:10px 0}
  .ask input::placeholder{color:var(--muted)}
  .btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent);white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--soft);color:var(--ink)}
  .btn.wide{width:100%;padding:16px;font-size:17px;border-radius:16px}

  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;box-shadow:0 1px 1px var(--line)}
  .chip.on{background:var(--ink);color:var(--bg)}
  .row2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;margin:12px 0 10px}
  .count{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
  .seg button{border:0;background:none;border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  .matchbar{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:15px}
  .matchbar p{margin:0;flex:1;min-width:0}
  .linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;white-space:nowrap}

  /* ---------- карточки ---------- */
  .list{display:grid;gap:14px}
  .car{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
  .car:active{transform:scale(.985)}
  .stage{position:relative;aspect-ratio:16/7;max-width:100%;background:radial-gradient(90% 120% at 50% 0%,var(--stage-a),var(--stage-b));display:grid;place-items:end center;overflow:hidden}
  .stage svg{width:80%;height:auto;margin-bottom:1%}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pill{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;font-weight:600}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .pill.transit i{background:var(--amber)}
  .pill.order i{background:var(--muted)}
  .tags{position:absolute;right:12px;top:12px;display:flex;gap:6px}
  .tag{background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
  .tag.new{background:var(--accent);color:var(--on-accent)}
  .c-body{padding:14px 16px 16px;display:grid;gap:8px}
  .c-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .brand{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .model{font:600 23px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin-top:2px;text-wrap:balance}
  .price{text-align:right;flex:none}
  .price b{font:600 22px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;display:block}
  .price small{font:500 12px var(--mono);color:var(--muted)}
  .plate{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

  .cta{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px;display:grid;gap:6px;margin-top:4px}
  .cta h3{margin:0;font:600 22px/1.15 var(--display);text-transform:uppercase;letter-spacing:.03em}
  .cta p{margin:0 0 8px;opacity:.75;font-size:15px}
  .cta .btn{justify-self:start;background:var(--bg);color:var(--ink)}

  /* ---------- машина ---------- */
  .back{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
  body.in-tg .back{display:none}
  .hero-stage{border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
  .d-title{display:grid;gap:4px;margin-bottom:12px}
  .d-title .model{font-size:32px}
  .d-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .d-price b{font:600 34px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .d-price small{font:500 14px var(--mono);color:var(--muted)}
  .where{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:16px}
  .where i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .where.transit i{background:var(--amber)}
  .where.order i{background:var(--muted)}
  .contacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .contacts a{background:var(--surface);color:var(--ink);text-decoration:none;border-radius:12px;padding:10px 14px;font:500 14px var(--mono);box-shadow:var(--shadow)}
  .cta .contacts a{background:color-mix(in srgb,var(--bg) 12%,transparent);color:var(--bg);box-shadow:none}
  .spec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
  .spec div{padding:12px 16px;border-top:1px solid var(--line);min-width:0}
  .spec div:nth-child(-n+2){border-top:0}
  .spec div:nth-child(odd){border-right:1px solid var(--line)}
  .spec span{display:block;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .spec b{font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
  .swatch{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);flex:none}
  .desc{font-size:16px;margin:16px 0 8px;max-width:62ch}
  .note{font-size:14px;color:var(--muted);margin:0}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px}
  .dock .btn{padding:15px 18px;font-size:16px}

  /* ---------- под заказ ---------- */
  h2{font:600 32px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 8px;text-wrap:balance}
  .sub{color:var(--muted);margin:0 0 20px;max-width:56ch}
  .lbl{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
  .steps{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
  .steps li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line)}
  .steps li:first-child{border-top:0}
  .steps em{font:500 13px var(--mono);font-style:normal;color:var(--accent)}
  .steps b{font-weight:600;display:block}
  .steps span{font-size:14px;color:var(--muted)}
  .steps small{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
  .form{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:14px}
  .fld{display:grid;gap:6px;min-width:0}
  .fld>span{font-size:14px;color:var(--muted)}
  .fld input,.fld textarea{width:100%;border:0;outline:0;background:var(--soft);border-radius:14px;padding:13px 14px;min-height:50px}
  .fld textarea{resize:none;min-height:84px}
  .fld input:focus,.fld textarea:focus{box-shadow:0 0 0 2px var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fchips{display:flex;flex-wrap:wrap;gap:6px}
  .fchips .chip{background:var(--soft);box-shadow:none}
  .fchips .chip.on{background:var(--ink);color:var(--bg)}
  .phone-row{display:flex;gap:8px}
  .phone-row input{flex:1}

  /* ---------- лист заявки ---------- */
  .veil{position:fixed;inset:0;background:rgba(5,8,9,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:620px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;
    padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto}
  .sheet.on{transform:none}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;font:600 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
  .sheet .for{color:var(--muted);font-size:15px;margin:0 0 14px}
  .done{text-align:center;padding:18px 4px 6px;display:grid;gap:8px;justify-items:center}
  .done .tick{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
  .done p{margin:0;color:var(--muted);max-width:36ch}

  .toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:30;
    background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  .empty{background:var(--surface);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <section class="view" id="v-list">
    <header class="top">
      <div class="mark"><b>Asia<i>.</i>AutoHub</b></div>
      <div class="langs" id="langs"></div>
    </header>
    <p class="lead-in" data-t="tagline"></p>
    <form class="ask" id="askForm" autocomplete="off">
      <input id="askInput" enterkeyhint="search" aria-label="search">
      <button class="btn" id="askBtn" type="submit" data-t="search_btn"></button>
    </form>
    <div class="seg" id="originSeg" style="display:inline-flex;margin-bottom:10px"></div>
    <div class="chips" id="bodies"></div>
    <div class="row2"><span class="count" id="count"></span><div class="seg" id="statusSeg"></div></div>
    <div id="matchbar"></div>
    <div class="list" id="list"></div>
  </section>

  <section class="view" id="v-car" hidden>
    <header class="top"><button class="back" onclick="history.back()" aria-label="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mark"><b>Asia<i>.</i>AutoHub</b></div></header>
    <div id="carBody"></div>
  </section>

  <section class="view" id="v-order" hidden>
    <header class="top"><button class="back" onclick="history.back()" aria-label="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="langs" id="langs2"></div></header>
    <div id="orderBody"></div>
  </section>

</div>
<div class="dock" id="dock" hidden><div><button class="btn wide" id="dockMain"></button><button class="btn ghost" id="dockAsk"></button></div></div>
<div class="toast" id="toast"></div>
<div class="veil" id="veil" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
const tg = window.Telegram?.WebApp;
const IN_TG = !!tg?.initData;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// демо без сервера: упрощённый разбор (на сервере — brain.py, с Claude — любые формулировки)
function localMatch(q){
  const t = q.toLowerCase(), f = {};
  const bodies = {suv:/кроссовер|внедорожник|джип|suv|crossover/, sedan:/седан|sedan/, wagon:/универсал|wagon|avant|estate/, coupe:/купе|coupe|спорт/, hatch:/хэтчбек|хетчбек|hatch/};
  for(const b in bodies) if(bodies[b].test(t)){ f.body = b; break; }
  const fuels = {diesel:/дизел|diesel/, hybrid:/гибрид|hybrid/, petrol:/бензин|petrol/, electric:/электр|electric/};
  for(const x in fuels) if(fuels[x].test(t)){ f.fuel = x; break; }
  const brands = {"BMW":/bmw|бмв/, "Land Rover":/range|land rover|рендж|ленд/, "Li Auto":/li auto|lixiang|ли ?авто|лисян|\bl[6-9]\b/, "Zeekr":/zeekr|зикр/,
    "BYD":/byd|бид|бyд/, "Geely":/geely|джили|monjaro|монжаро/, "Genesis":/genesis|генезис|gv80|g80/, "Hyundai":/hyundai|хендай|хёндай|хундай|palisade|палисад|grandeur|грандеур/,
    "Kia":/kia|киа|sorento|соренто|k5/};
  for(const b in brands) if(brands[b].test(t)){ f.brand = b; break; }
  if(/коре|korea|корея/.test(t)) f.origin = "kr"; else if(/кита|china|кытай/.test(t)) f.origin = "cn";
  if(/нов(ый|ая|ую|ые)|без пробега|\bnew\b|жаңы/.test(t)) f.isNew = true;
  const y = t.match(/\b(20[0-3]\d|199\d)\b/); if(y) f.year = +y[1];
  const m = t.replace(/\b(20[0-3]\d|199\d)\b/g, "").match(/(\d[\d\s]*)\s*(k|к|тыс\w*|thousand|миң)?/);
  if(m){ let n = +m[1].replace(/\s/g, ""); if(m[2]) n *= 1000; if(n >= 300000) n /= 87.5; if(n >= 1000) f.budget = n; }
  if(/семейн|family|үй-бүлө/.test(t) && !f.body) f.family = true;
  const kind = /под заказ|привез|заказ|order|import|буйрутма/.test(t) ? "order" : "search";
  if(!Object.keys(f).length) return {ids:[], kind: kind === "order" ? "order" : "unknown"};
  const ids = CARS.filter(c => (!f.body || c.body===f.body) && (!f.fuel || c.fuel===f.fuel) && (!f.brand || c.brand===f.brand)
    && (!f.origin || c.origin===f.origin) && (!f.isNew || !c.mileage_km)
    && (!f.year || c.year>=f.year) && (!f.budget || c.price_usd <= f.budget*1.07) && (!f.family || ["suv","wagon"].includes(c.body))).map(c => c.id);
  return {ids, kind};
}

async function sendLead(body, form){
  const name = $("lName").value.trim(), phone = $("lPhone").value.trim();
  if(phone.replace(/\D/g, "").length < 6) return toast(T("err_phone"));
  const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
  try{
    const r = DEMO ? {id: 100 + Math.floor(Math.random()*900)} : await api("/api/lead", {method:"POST", body: JSON.stringify({...body, name, phone})});
    ME = {...(ME||{}), name, phone};
    tg?.HapticFeedback?.notificationOccurred("success");
    openSheet(`<div class="done"><div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h3>${T("ok_t",{id:r.id})}</h3><p>${T("ok_s")}${DEMO ? "<br>" + T("demo") : ""}</p>
      <button class="btn wide" style="margin-top:8px" onclick="closeSheet()">${T("ok_b")}</button></div>`);
  }catch(e){ toast(T("err")); btn.disabled = false; }
}

// ---------- лист, тост, навигация ----------
let sheetOpen = false;
function openSheet(html){ $("sheetBody").innerHTML = html; sheetOpen = true; $("veil").classList.add("on"); $("sheet").classList.add("on"); tg?.BackButton?.show(); }
function closeSheet(){ sheetOpen = false; $("veil").classList.remove("on"); $("sheet").classList.remove("on"); if(!location.hash.slice(1)) tg?.BackButton?.hide(); }
let toastT;
function toast(s){ const t = $("toast"); t.textContent = s; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3500); }

function go(h){ location.hash = h; }
function render(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
  const langs = Object.keys(I18N).map(l => `<button class="${l===LANG?"on":""}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
  $("langs").innerHTML = langs; $("langs2").innerHTML = langs;
  const h = location.hash.slice(1);
  const view = h.startsWith("car-") ? "car" : h === "order" ? "order" : "list";
  for(const v of ["list","car","order"]) $("v-"+v).hidden = v !== view;
  $("dock").hidden = view !== "car";
  if(view === "car") renderCar(h.slice(4)); else if(view === "order") renderOrder(); else renderList();
  if(view === "list") tg?.BackButton?.hide(); else tg?.BackButton?.show();
}
window.addEventListener("hashchange", () => { closeSheet(); render(); window.scrollTo(0, 0); });
tg?.BackButton?.onClick(() => sheetOpen ? closeSheet() : history.back());

if(tg){ tg.ready(); tg.expand(); if(IN_TG){ document.body.classList.add("in-tg"); document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); try{ tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }catch(e){} } }
// ссылка из бота «Подробнее»: ?lang=ru#car-<id> / #order
load();
</script>
